<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizing an Isotopy</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <script src="https://cdnjs.cloudflare.com"></script>
    <style>
        body { margin: 0; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f5f5f5; }
        header { padding: 20px; text-align: center; }
        /* 2. Style the viewer container */
        #container { width: 90vw; height: 70vh; background: #ffffff; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; }
        model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
    </style>
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
        }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script>
    // Select elements for the Left side
    const sliderLeft = document.querySelector('#slider-left');
    const viewLeft = document.querySelector('#view-left');
    const labelLeft = document.querySelector('#label-left');
    
    // Select elements for the Right side
    const sliderRight = document.querySelector('#slider-right');
    const viewRight = document.querySelector('#view-right');
    const labelRight = document.querySelector('#label-right');
    
    // Update Left
    sliderLeft.addEventListener('input', (e) => {
        const val = e.target.value;
        // Assuming you have an array of R_values from your Python/R code
        labelLeft.innerText = (5 + (val * 0.34)).toFixed(2); 
        viewLeft.src = `assets/torus_sweep_R${val}.glb`;
    });
    
    // Update Right
    sliderRight.addEventListener('input', (e) => {
        const val = e.target.value;
        labelRight.innerText = (5 + (val * 0.34)).toFixed(2);
        viewRight.src = `assets/torus_sweep_R${val}.glb`;
    });
    </script>
    <style>
    .dual-container {
      display: flex;
      gap: 30px;
      justify-content: center;
      align-items: flex-start;
      margin: 20px 0;
    }
    
    .column {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid #eee; /* Subtle border for clarity */
      padding: 15px;
      background: white;
    }
    
    model-viewer {
      width: 100%;
      height: 400px;
    }
    
    .controls {
      width: 80%;
      margin-top: 15px;
      text-align: center;
    }
    
    input[type=range] {
      width: 100%;
    }
    </style>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>

<header>
    <h1>Visualizing an Isotopy </h1>
</header>

<p> An isotopy is a continuous deformation through time.  The colors below correspond to intrinsic changes to the metric on the torus.
</p>


<div class="dual-container">
  <div class="column">
    <h3>Configuration 1</h3>
    
    <model-viewer 
        id="torus-player"
        src="step_0.glb"
        alt="A deforming torus"
        camera-controls
        style="width: 500px; height: 500px; background-color: #ffffff; border: 1px solid #ddd;">
    </model-viewer>

    <div class="controls">
      <input type="range" id="slider-left" min="0" max="29" value="0">
      <div style="display: flex; justify-content: space-between; font-size: 0.8em; color: #666;">
            <span>Square-ish</span>
            <span>Fully Deformed</span>
      </div>
    </div>
  </div>

  <div class="column">
    <h3>Configuration 2</h3>
    
    <model-viewer 
        id="torus-player"
        src="../assets/sequence/torus_0.glb"
        alt="A deforming torus"
        camera-controls
        style="width: 500px; height: 500px; background-color: #ffffff; border: 1px solid #ddd;">
    </model-viewer>

    <div class="controls">
      <input type="range" id="slider-right" min="0" max="29" value="0">
      <div style="display: flex; justify-content: space-between; font-size: 0.8em; color: #666;">
            <span>Square-ish</span>
            <span>Fully Deformed</span>
      </div>

    </div>
  </div>
</div>


<script>
    const viewer = document.querySelector('#torus-player');
    const slider = document.querySelector('#deform-slider');

    slider.addEventListener('input', (event) => {
        const frame = event.target.value;
        // Update the source of the 3D model
        viewer.src = `step_${frame}.glb`;
    });
</script>

</body>
</html>
