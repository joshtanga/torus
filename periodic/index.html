<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Periodic Torus Automorphism Visualization</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
        }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<style>
.triangle-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr; /* Three equal columns */
  grid-template-rows: auto auto;      /* Two rows */
  gap: 10px;
  max-width: 1000px;
  margin: 40px auto;
}

.viewer-container {
  text-align: center;
}

/* Position the top viewer in the 2nd column of the 1st row */
.pos-top {
  grid-column: 2;
  grid-row: 1;
}

/* Position the bottom viewers in the 1st and 3rd columns of the 2nd row */
.pos-left {
  grid-column: 1;
  grid-row: 2;
}

.pos-right {
  grid-column: 3;
  grid-row: 2;
}

model-viewer {
  width: 100%;
  height: 320px;
  --poster-color: transparent;
}

.triangle-grid p {
  font-family: serif; /* Better for math symbols */
  font-size: 1.1em;
  margin-top: 0;
}
</style>

</head>
<body>

<header>
    <h1>Periodic Transformation of Torus 
</header>

<div class="triangle-grid">
  <div class="viewer-container pos-top">
                <model-viewer 
                src="../assets/uv_checkerboard_res_1024_iter_1_period_3_map.glb" 
                alt="Torus Iteration 1" rotate camera-controls shadow-intensity="1">
            </model-viewer>

    <p>$\begin{bmatrix} 0 & 1 \\ -1 & -1 \end{bmatrix}^3$</p>
  </div>
  
  <div class="viewer-container pos-left">
            <model-viewer 
                src="../assets/uv_checkerboard_res_1024_iter_2_period_3_map.glb" 
                alt="Torus Iteration 1" camera-controls shadow-intensity="1">
            </model-viewer>

    <p>$\begin{bmatrix} 0 & 1 \\ -1 & -1 \end{bmatrix}^1$</p>
  </div>
  
  <div class="viewer-container pos-right">
            <model-viewer 
                src="../assets/uv_checkerboard_res_1024_iter_3_period_3_map.glb" 
                alt="Torus Iteration 1" camera-controls shadow-intensity="1">
            </model-viewer>
    <p>$\begin{bmatrix} 0 & 1 \\ -1 & -1 \end{bmatrix}^2$</p>
  </div>
</div>

<header>
    <h2>Texture Transformation Comparison</h2>
</header>

<div class="triangle-grid">
  <div class="viewer-container pos-top">
    <figure>
        <img src="../assets/uv_checkerboard.png" alt="Original">
        <figcaption align="center">Original Texture</figcaption>
    </figure>
  </div>
  <div class="viewer-container pos-left">
    <figure>
        <img src="../assets/uv_checkerboard_res_1024_iter_1_period_3_map.png" alt="Iter 1">
        <figcaption align="center">Iter 1 Texture</figcaption>
    </figure>
  </div>
  <div class="viewer-container pos-right">
    <figure>
        <img src="../assets/uv_checkerboard_res_1024_iter_2_period_3_map.png" alt="Iter 2">
        <figcaption align="center">Iter 2 Texture</figcaption>
    </figure>
  </div>
</div>

<footer>
    <p>Use your mouse to rotate each torus independently • Scroll to zoom</p>
</footer>

</body>
</html>
